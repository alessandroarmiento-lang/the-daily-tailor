# Deploy The Daily Tailor to Fly on every push to main.
# One-time setup: repo secret FLY_API_TOKEN (fly tokens create deploy -x 999999h).
name: Fly deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "Missing repo secret FLY_API_TOKEN."
            echo "Create once: fly tokens create deploy -x 999999h"
            echo "Then: GitHub → Settings → Secrets → Actions → FLY_API_TOKEN"
            exit 1
          fi
          flyctl deploy --remote-only --app the-daily-tailor
